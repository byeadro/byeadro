name: Generate metrics

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: byeadro
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Chicago
          config_display: large
          config_padding: 0, 8 + 6%
          config_order: base.header, isocalendar, languages, activity, followup, code, achievements, repositories

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_ignored: html, css, scss, tex
          plugin_languages_details: percentage, bytes-size
          plugin_languages_limit: 8

          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: all

          plugin_followup: yes
          plugin_followup_sections: repositories, user

          plugin_code: yes
          plugin_code_lines: 12

          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact

          plugin_repositories: yes
          plugin_repositories_pinned: 4
