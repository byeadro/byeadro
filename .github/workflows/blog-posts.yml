name: Pull latest MWI posts

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://iambond.substack.com/feed"
          max_post_count: 5
          template: "- **[$title]($url)**<br/><sub>$description</sub><br/><br/>"
          disable_sort: false
          # Substack/Cloudflare returns 403 to GitHub's datacenter IPs with the
          # default rss-parser UA. Send a real browser UA + Accept header to bypass.
          user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          accept_header: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
